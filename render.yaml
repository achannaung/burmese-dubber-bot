services:
- type: web
name: burmese-dubber-bot
runtime: python
plan: free
buildCommand: pip install -r requirements.txt
startCommand: python telegram_bot.py
envVars:
- key: PYTHON_VERSION
value: 3.11.0
- key: TELEGRAM_BOT_TOKEN
sync: false # Set in Render dashboard
- key: GEMINI_API_KEY
sync: false # Set in Render dashboard